<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake — Mini Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  h1 span { color: #4ade80; }
  .scores {
    display: flex; gap: 24px; margin: 10px 0 12px;
    font-size: 17px; font-weight: 600;
  }
  .scores b { color: #4ade80; }
  .wrap { position: relative; }
  canvas {
    background: #111c33;
    border: 2px solid #1e293b;
    border-radius: 10px;
    max-width: 92vw;
    height: auto;
    display: block;
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(2, 6, 23, 0.78);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 10px; text-align: center; padding: 20px;
  }
  .overlay h2 { font-size: 26px; margin-bottom: 8px; }
  .overlay p { color: #94a3b8; margin-bottom: 16px; font-size: 15px; }
  button {
    background: #22c55e; color: #052e16; border: none;
    font-size: 16px; font-weight: 700;
    padding: 10px 26px; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #4ade80; }
  .hint { margin-top: 12px; color: #64748b; font-size: 13px; text-align: center; }
  .pad {
    display: none;
    margin-top: 14px;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
    gap: 6px;
  }
  .pad button {
    background: #1e293b; color: #e2e8f0; font-size: 20px; padding: 0;
    border-radius: 10px;
  }
  .pad button:active { background: #334155; }
  .pad .empty { visibility: hidden; }
  @media (pointer: coarse) { .pad { display: grid; } }
</style>
</head>
<body>

<h1>🐍 <span>Snake</span></h1>
<div class="scores">
  <div>Score: <b id="score">0</b></div>
  <div>Best: <b id="best">0</b></div>
</div>

<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">Ready?</h2>
    <p id="ovText">Eat the food, grow longer, don't hit the walls or yourself.</p>
    <button id="startBtn">▶ Start</button>
  </div>
</div>

<div class="pad">
  <span class="empty"></span>
  <button data-dir="up">▲</button>
  <span class="empty"></span>
  <button data-dir="left">◀</button>
  <button data-dir="down">▼</button>
  <button data-dir="right">▶</button>
  <span class="empty"></span>
  <span class="empty"></span>
  <span class="empty"></span>
</div>

<p class="hint">⌨️ Arrow keys or WASD to move · Space to start / restart · P to pause<br>📱 Swipe or use the pad on mobile</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20, CELL = canvas.width / GRID;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const startBtn = document.getElementById('startBtn');

let snake, dir, dirQueue, food, score, speed, timer, running, paused;
let best = Number(localStorage.getItem('snake_best') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
  dir = {x: 1, y: 0};
  dirQueue = [];
  score = 0;
  speed = 140;
  paused = false;
  scoreEl.textContent = 0;
  placeFood();
  draw();
}

function placeFood() {
  while (true) {
    const f = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function setDir(x, y) {
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (last.x === -x && last.y === -y) return;   // no instant reverse
  if (last.x === x && last.y === y) return;     // same direction
  if (dirQueue.length < 2) dirQueue.push({x, y});
}

function step() {
  if (dirQueue.length) dir = dirQueue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snake_best', best);
    }
    if (score % 50 === 0 && speed > 60) speed -= 10;  // faster every 5 foods
    placeFood();
  } else {
    snake.pop();
  }

  draw();
  timer = setTimeout(step, speed);
}

function draw() {
  ctx.fillStyle = '#111c33';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // subtle grid
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }

  // food
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
    const pad = i === 0 ? 1 : 2;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    ctx.fill();
  });
}

function start() {
  clearTimeout(timer);
  reset();
  running = true;
  overlay.style.display = 'none';
  timer = setTimeout(step, speed);
}

function gameOver() {
  running = false;
  clearTimeout(timer);
  ovTitle.textContent = '💀 Game Over';
  ovText.textContent = 'Your score: ' + score + ' · Best: ' + best;
  startBtn.textContent = '↻ Play again';
  overlay.style.display = 'flex';
  draw();
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearTimeout(timer);
    ovTitle.textContent = '⏸ Paused';
    ovText.textContent = 'Press P or tap Resume to continue.';
    startBtn.textContent = '▶ Resume';
    overlay.style.display = 'flex';
  } else {
    overlay.style.display = 'none';
    timer = setTimeout(step, speed);
  }
}

startBtn.addEventListener('click', () => {
  if (paused) { togglePause(); } else { start(); }
});

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
  else if (k === ' ' || k === 'enter') { paused ? togglePause() : start(); }
  else if (k === 'p') togglePause();
});

// touch pad
document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('click', () => {
    const d = b.dataset.dir;
    if (d === 'up') setDir(0, -1);
    if (d === 'down') setDir(0, 1);
    if (d === 'left') setDir(-1, 0);
    if (d === 'right') setDir(1, 0);
  });
});

// swipe
let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive: true});

reset();
</script>
</body>
</html>
